# Configuração do golangci-lint
# Versão do golangci-lint recomendada
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - goconst
    - gocyclo
    - gosec
    - stylecheck
    - unconvert
    - dupl

linters-settings:
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  goimports:
    local-prefixes: github.com/marcopollivier/battleship

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
